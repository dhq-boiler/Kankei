name: Release installer
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Expected tag vMAJOR.MINOR.PATCH.' }
          "RELEASE_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
      - name: Test
        run: dotnet test Kankei.sln -c Release
      - name: Package installer and update feed
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Kankei-${{ env.RELEASE_VERSION }}-win-x64
          path: artifacts/releases/${{ env.RELEASE_VERSION }}/*
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem "artifacts/releases/$env:RELEASE_VERSION" -File | ForEach-Object FullName)
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "Kankei $env:RELEASE_VERSION" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }

