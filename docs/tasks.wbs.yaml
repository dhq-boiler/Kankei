tasks:
- id: initial-vertical-slice
  title: 初期縦切り（保存・復元・オーバーレイ・ローカル API）
  estimateHours: 8
  remainingHours: 0
  notes: 初回実装。Kudaki 未接続時の fallback として作成。
- id: mcp-adapter
  title: MCP アダプター実装
  estimateHours: 8
  remainingHours: 2
  notes: ローカル設定の stdio MCP サーバーと export/launch/import ツールを公式 SDK で接続し、保存・復元に組み込む。 バージョン付き JSON を保持し、未登録アダプターや通信失敗を成功として扱わない。 qa-test-design 検証観点 EQ-1 正常な状態往復、EQ-2 アダプターなし、ER-1 未登録 ID、 ER-2 不正 JSON、BV-1 対応/非対応バージョン、ER-3 ツールエラー、ER-4 タイムアウト・キャンセル。 実接続先のアプリ固有ツール契約は設定で指定する。まず模擬 MCP サーバーで統合検証する。 2026-09-11 Codex：公式 SDK 2.2.0 の stdio 接続、設定検証、状態のバージョン管理、保存・復元への組み込み、タイムアウト・エラー処理を実装。別プロセスの模擬 MCP サーバーを含む24件のテストが成功。Release ビルドは警告0・エラー0。README に設定と制約を記載。残作業2時間は実アプリのツール契約・設定の確認と vs-mcp による画面復元検証。実アプリ接続・UI確認は未実施。
- id: restore-hardening
  title: マルチモニター・DPI・識別の堅牢化
  estimateHours: 8
  remainingHours: 4
  notes: 2026-09-11 サブモニターの最大化Chromeがメインへ復元される不具合を修正する。モニター情報と通常位置を記録し、移動後に最大化。検証はサブモニター最大化・負座標・モニター配置変更・切断・旧保存データを対象とする。 実装済み：モニター名/領域/作業領域と通常位置を追加。通常化→対象位置へ移動→最大化/最小化の順序へ修正。旧defaultの負座標にも対応。PerMonitorV2を指定。VS2026ビルド成功、44件テスト成功（実ウィンドウの2画面移動3件を含む）。vs-mcpでYouTube Chromeを保存しDISPLAY2・Left=-1920を確認。残作業は異種DPI・モニター再接続の実機検証と識別の追加堅牢化。
- id: selective-window-save
  title: 選んだウィンドウだけの配置保存
  estimateHours: 3
  remainingHours: 0
  notes: 通知領域からウィンドウ一覧を開き、選択した位置・サイズ・表示状態だけを保存する。アプリ全体の内部状態は取得しない。未選択・閉じた対象・同一アプリの複数ウィンドウを検証し、識別できない復元先を誤操作しない。UI と回帰テストで確認する。 2026-09-11 実装完了。選択画面・保存時の再取得・閉じた対象の拒否・上書き確認・タイトル/実体での照合を追加。VS 2026 ビルド成功、35件テスト成功。vs-mcp UI操作で1件だけ保存し、JSONのWindowsが1件かつAdapterId/AdapterStateJsonがnullであることを確認。未選択時の保存禁止と更新時の選択解除も確認。検証用レイアウト selection-check-20260911 を保存。
- id: named-layout-restore
  title: 保存済みレイアウトを選択して復元
  estimateHours: 1
  remainingHours: 0
  notes: 保存画面にレイアウト一覧と復元ボタンを追加。保存後と画面再表示時に更新し、未選択と削除済み対象を扱う。通知領域からもアクセス可能にする。 追加要望によりトレイ右クリックにも全プロファイルを動的表示。2026-09-11 VSビルド成功、既存44テスト成功。JidoDebuggerのstdio MCP経由UIAで別名monitor-check-20260911の選択・復元完了を確認。トレイ右クリック→復元サブメニューにモンハンワイルズ_VC/default/検証用プロファイルが表示されることも確認。
- id: youtube-playback-state
  title: ChromeのYouTube再生リスト・再生位置・一時停止状態を保存復元
  estimateHours: 5
  remainingHours: 1
  notes: 選択したChromeウィンドウのYouTube動画URL・list/index・再生秒数・再生/一時停止を保存する。通常動画/再生リスト/一時停止/再生中/取得失敗/古い配置データを検証し、取得不能を黙って保存成功にしない。JidoDebuggerで実画面確認する。 手動呼び出し時は対象Chromeが再生中なら呼び出し直前の状態を一時保持して配置復元後に適用する。シャットダウン直前にも最新状態を取得し次回レジューム用に永続化する。プロファイルの配置定義と最新の再生チェックポイントは分離する。 2026-09-11 実装済み：現在の再生状態を優先する手動復元、既存Chromeの動画/再生リスト照合による二重起動防止、10秒ごとと終了/SessionEnding時のチェックポイント保存、原子的ファイル置換と旧記録保護。VS2026ビルド成功、77テスト成功。JidoDebuggerで保存時3:01:05から3:01:06の一時停止復元、現在位置優先の復元、新規Chrome起動後の停止復元、番号不一致でも既存ウィンドウを再利用し二重起動しないことを確認。検証用の追加Chromeは閉じ、一時プロファイルも削除。残り1時間は実Windowsシャットダウン/再起動順序と広告・低速回線下の実機確認。実シャットダウンは未実行。
- id: app-logo-concept
  title: Kankeiアプリロゴの初稿作成
  estimateHours: 0.5
  remainingHours: 0
  notes: 還景（作業環境を保存・復元）の意味を反映したロゴを画像生成で試作し、会話内で提示する。
- id: app-logo-assets
  title: Kataと同構成のロゴ素材をassetsに格納
  estimateHours: 0.5
  remainingHours: 0
  notes: 原画像を保存し、文字なしマークをSVG化。通常・ライト・透過のPNG7サイズとICOを生成して形式を検証する。
- id: app-icon-integration
  title: 実行ファイル・ウィンドウ・通知領域にアプリアイコンを設定
  estimateHours: 0.5
  remainingHours: 0
  notes: VS2026ビルド成功、JidoDebuggerでタイトルバー・通知領域に新アイコンを表示確認。assets/icons/kankei.icoを埋め込み、EXE・WPFウィンドウ・NotifyIconで共用する。ビルドとJidoDebuggerによる実画面で確認する。
- id: release-auto-update
  title: バージョン情報・インストーラー・GitHub Release配布と自動更新
  estimateHours: 8
  remainingHours: 0
  notes: Kataの既存ダイアログを参考にバージョン情報と更新操作を作成。公開dhq-boiler/Kankeiを新設し、GitHub Actionsで検証・インストーラー作成・Release公開。起動中の定期確認、通知、自動ダウンロードと終了時適用、即時更新時の状態保存と再起動を実装。正常/最新版/未インストール/通信失敗/二重実行/終了処理を検証する。 2026-09-11 完了：濃紺UIと512pxロゴを適用。公開dhq-boiler/Kankeiを作成、ActionsのCIとRelease生成が成功しv0.1.1にSetup/Portable/nupkg/feedを公開。本体KankeiAppと保存データKankeiを分離。ローカル92テスト成功。JidoDebuggerで検証用0.1.0のインストール、自動ダウンロード、今すぐ更新、0.1.1での再起動と最新版表示を実機確認。終了時適用・通信失敗・二重実行等は単体テストで確認。実OSシャットダウンはyoutube-playback-stateの残作業。
- id: monitor-preview
  title: メイン画面右側にモニター配置と復元予定ウィンドウのプレビュー
  estimateHours: 2
  remainingHours: 0
  notes: 2026-09-11 VS2026ビルドと92テスト成功。JidoDebuggerで3画面の位置関係、defaultの2件の復元予定、チェックした1件の現在位置への切り替えを確認。現在のモニター領域を同比率で描画し、選択したプロファイルの復元予定位置を重ねる。最大化・最小化・切断時の配置を復元計算と共有し、選択対象の現在位置も確認可能にする。JidoDebuggerで表示を検証。
- id: taskbar-icon-fix
  title: タスクバーでデフォルトのままのアプリアイコンを修正
  estimateHours: 1
  remainingHours: 0
  notes: 2026-09-11 インストール版0.1.1を再起動し、JidoDebugger UIAでタスクバーのvelopack.KankeiAppを特定、該当領域の画像で専用アイコンの正常表示を確認。開発EXE・インストール本体・起動用EXEの抽出アイコンとデスクトップショートカット参照先は正常。コード変更なし。報告されたデフォルト表示は再現できず、キャッシュ等の根因は未特定。
- id: copy-restore-api
  title: 選択した配置プロファイルのREST APIをクリップボードへコピー
  estimateHours: 1
  remainingHours: 0
  notes: 復元欄にPOST用URLとPowerShell向けcurlコマンドのコピー操作を追加。未選択時は無効、日本語IDはURLエンコードし、コピー失敗を表示。コピーだけでは復元しない。JidoDebuggerで選択切替とクリップボードを検証。 2026-09-11 実装完了、VS2026ビルドと92テスト成功。日本語IDのコピーURL/curlをクリップボードと照合し、一時プロファイルへの実POSTが202 Acceptedになることを確認。
- id: delete-layout-profile
  title: 配置プロファイルの削除
  estimateHours: 1
  remainingHours: 0
  notes: 選択プロファイルを名前付き確認ダイアログ経由で削除。キャンセル時は保持、保存・復元中と未選択は無効。削除後に一覧とプレビューを更新。JidoDebuggerで一時プロファイルを使って確認。 2026-09-11 キャンセル時のファイル保持、確定時の削除と一覧・プレビュー解除、未選択時の削除無効を実画面で確認。一時プロファイルは削除済み。
- id: chrome-page-restore
  title: Chromeの通常ページをURLで保存し未起動なら新規ウィンドウで復元
  estimateHours: 3
  remainingHours: 0
  notes: Chromeの選択中タブのHTTP(S) URLを保存し、復元時はURL一致を確認して再利用。元ウィンドウが別ページへ移動していたら上書きせず新規ウィンドウを作成。YouTube専用処理と旧データ互換を維持。URL正規化・同じHWNDの別ページ・候補なし・重複呼び出し・起動失敗を検証し、JidoDebuggerで実画面を確認。 2026-09-11 実装完了。VS2026ビルド成功、112テスト成功。JidoDebuggerとRESTで別ページに移動した元ChromeのURLを保持した新規ウィンドウ復元、繰り返し呼び出し時の再利用、背景タブの選択とURL確認、モニター上の最大化を実機確認。検証用Chrome2ウィンドウと一時プロファイルは削除済み。旧プロファイルはページを開いて再保存が必要。日本語プロファイルのAPI作成LocationヘッダーもURLエンコードして201応答を確認。
- id: language-i18n
  title: Languageボタンと日本語・英語の切替を実装
  estimateHours: 4
  remainingHours: 0
  notes: >-
    バージョン情報の隣にLanguageボタンを追加。言語リソースを分離し、日本語/Englishを即時切替・次回起動へ永続化。メイン画面、配置プレビュー、バージョン情報、トレイ、確認・進捗メッセージを対応。プロファイル名やAPI契約は変えない。英語のレイアウト、切替時の選択保持、再起動後の保持をJidoDebuggerで確認。


    2026-09-11 実装完了。日本語メッセージIDと英語JSONカタログ、即時切替とlanguage.jsonへの原子的保存を追加。VS2026ビルド成功、118テスト成功（設定往復・不正設定・保存失敗・翻訳プレースホルダー検証を含む）。JidoDebuggerで英語のメイン・About・配置マップ、選択とチェックの保持、再起動後のEnglish保持、削除確認のYes/No表示とNoでの取消を確認。言語設定は日本語へ戻した。トレイ文言はメニューを開く際に選択言語で更新する。
- id: focused-layout-ui
  title: 配置プレビュー中心のメイン画面と機能別ダイアログへ分割
  estimateHours: 4
  remainingHours: 0
  notes: 上部Language・About、中央プレビュー、下部配置コンボ・新規配置を配置。保存ダイアログ、選択配置の操作ダイアログ、API連携ダイアログへ分離する。選択のみでは復元せず、保存・削除後の一覧同期、操作中の終了防止、日本語/英語、キャンセル動作をJidoDebuggerで確認する。 追記：ユーザーの追加指定により、三点リーダーは配置操作ダイアログではなくポップアップメニューに変更。復元は直接実行、保存し直し・API連携・削除確認のみ専用ダイアログを開く。 2026-09-11 完了：中央プレビュー・下部コンボ/新規配置・上部Language/Aboutへ整理。三点リーダーはポップアップメニューとし、保存/API連携/削除確認のみ専用ダイアログへ分離。VS2026ビルドと118テスト成功。JidoDebuggerで一時配置の新規保存、メイン選択とプレビューへの反映、メニューから直接復元と完了表示保持、API URLのコピー、保存し直しの名前引継ぎと取消、削除取消で保持/確定で削除、日本語・英語画面を確認。一時配置は削除し日本語へ戻した。 追加修正：Language/配置操作のポップアップに残る標準の白いアイコン欄・チェック・区切り線を専用共通テンプレートで置換し、ホバーとキーボード選択を含めて確認する。 追加修正完了：ContextMenu/MenuItem/Separatorの専用テンプレートを共用。白いアイコンガターと標準チェック枠を除去し、濃紺背景・青いチェック・選択背景・フォーカス枠・区切り線を統一。VS2026ビルド成功。JidoDebuggerで両メニューを開き、UIAの範囲から撮影した画像で表示を確認。下矢印による選択表示とEscapeで閉じる動作も確認。
